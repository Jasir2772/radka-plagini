name: Build RadiationZone Plugin

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: {}   # GitHub saytida/ilovasida "Run workflow" tugmasi bilan ham qo'lda ishga tushirish mumkin

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodni olish (checkout)
        uses: actions/checkout@v4

      - name: Java 17 o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Maven bilan build qilish
        run: mvn -B clean package --file pom.xml

      - name: Tayyor .jar faylni artifact sifatida yuklash
        uses: actions/upload-artifact@v4
        with:
          name: RadiationZone-jar
          path: target/*.jar
          if-no-files-found: error
