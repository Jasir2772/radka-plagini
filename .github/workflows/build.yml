name: Build APK from zip
on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Zip faylni ochish
        run: |
          ZIP=$(ls *.zip | head -n1)
          echo "Zip: $ZIP"
          mkdir -p work
          unzip -o "$ZIP" -d work
          PKG=$(find work -name package.json -not -path '*/node_modules/*' | head -n1)
          test -n "$PKG" || { echo "package.json topilmadi"; exit 1; }
          echo "APPDIR=$(dirname "$PKG")" >> "$GITHUB_ENV"

      - name: Android loyihani tayyorlash
        run: |
          cd "$APPDIR"
          npm install
          npx cap add android
          sed -i 's/<activity/<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: APK qurish
        run: |
          cd "$APPDIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: zabt-et-apk
          path: ${{ env.APPDIR }}/android/app/build/outputs/apk/debug/app-debug.apk
