name: Build APK from zip

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q Sinf6Darslar.zip -d work

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -n1)
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Patch MainActivity
        run: sed -i 's/setImmersive(/setVideoImmersive(/g' work/Sinf6Darslar/app/src/main/java/uz/sinf6/darslar/MainActivity.java

      - name: Patch Kotlin duplicate classes
        run: grep -q kotlin-bom work/Sinf6Darslar/app/build.gradle || printf '\ndependencies {\n    implementation platform("org.jetbrains.kotlin:kotlin-bom:1.8.22")\n}\n' >> work/Sinf6Darslar/app/build.gradle

      - name: Build debug APK
        working-directory: work/Sinf6Darslar
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: 6-sinf-darslar-apk
          path: work/Sinf6Darslar/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
