name: Build APK from zip

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(ls -1 *.zip 2>/dev/null | head -n1 || true)
          if [ -z "$ZIP" ]; then
            echo "::error::Repo ildizida .zip fayl topilmadi. Sinf6Darslar.zip ni repoga yuklang."
            exit 1
          fi
          echo "Zip: $ZIP"
          mkdir -p work
          unzip -q "$ZIP" -d work
          SETTINGS=$(find work -maxdepth 3 -name settings.gradle | head -n1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::Zip ichida settings.gradle topilmadi (noto'g'ri zip?)."
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: 6-sinf-darslar-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
